name: Report a job
description: Flag a job in knet as a scam, fake, misleading or otherwise wrong.
title: "Report: "
labels: ["job-report"]
body:
  - type: markdown
    attributes:
      value: |
        Easiest from the app: press "Report" on the job and this form is filled in for you.
        Reports are counted per person. When 3 different people report a job, it's hidden from
        every knet app until an admin reviews it. Your report is public, like any GitHub issue.
  - type: input
    id: post
    attributes:
      label: Which post
      description: Filled in by the app. For jobs posted on knet, the post's issue number (like #42).
      placeholder: "#42"
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - Scam or fraud (asks for money, personal data, etc.)
        - Fake company or poster
        - Misleading (salary, location, role)
        - Discriminatory
        - Spam or duplicate
        - Position already filled
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Optional. What did you notice?
