# Job posts, reports and verified posters. See README → "Posting a job".
# Writes jobs/posted.json (read by every app), jobs/verified.json and jobs/reports.json.
#
# Post issues (label job-post):
# - opened / edited / reopened: check the post; publish it if nothing fails.
# - labeled "approved" (admins): publish even if a check failed; clears reports.
# - labeled "revoke" (admins): remove the post and close the issue.
# - labeled / unlabeled "verified-poster" (admins): verify / unverify the poster.
# - closed: remove the post (position filled).
# Report issues (label job-report, from the "Report a job" form):
# - opened: count the report; 3 different people hide the post (or, for jobs from boards and
#   company pages, add it to jobs/hidden.json) until an admin reviews.
# - labeled "approved" on a job report: un-hide that job.
# Daily: drop posts older than 30 days and close their issues.
name: Job posts

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  NUMBER: ${{ github.event.issue.number }}

jobs:
  review:
    if: >-
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'job-post') &&
      github.event.issue.state == 'open' &&
      (contains(fromJSON('["opened","edited","reopened"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    concurrency:
      group: job-post-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the post
        id: review
        run: node scripts/review-job.js audit > comment.md
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POSTER: ${{ github.event.issue.user.login }}
          OVERRIDE: ${{ contains(github.event.issue.labels.*.name, 'approved') }}
          APPROVED_NOW: ${{ github.event.action == 'labeled' && github.event.label.name == 'approved' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update jobs/*.json
        if: steps.review.outputs.changes == 'true'
        run: ./.github/scripts/apply-post.sh "Job post #$NUMBER: ${{ steps.review.outputs.action }}"
      - name: Comment and label
        run: |
          gh issue comment "$NUMBER" --body-file comment.md
          if [ "$ACTION" = "upsert" ]; then
            gh issue edit "$NUMBER" --add-label published --remove-label needs-review --remove-label reported || true
          else
            gh issue edit "$NUMBER" --add-label needs-review --remove-label published || true
          fi
        env:
          ACTION: ${{ steps.review.outputs.action }}

  close-or-revoke:
    if: >-
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'job-post') &&
      (github.event.action == 'closed' || (github.event.action == 'labeled' && github.event.label.name == 'revoke'))
    runs-on: ubuntu-latest
    concurrency:
      group: job-post-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remove the post
        run: node scripts/review-job.js ${{ github.event.action == 'closed' && 'close' || 'revoke' }} > comment.md
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - name: Update jobs/*.json
        run: ./.github/scripts/apply-post.sh "Job post #$NUMBER: removed (${{ github.event.action }})"
      - name: Comment
        run: |
          if [ -s comment.md ]; then gh issue comment "$NUMBER" --body-file comment.md; fi
          gh issue edit "$NUMBER" --remove-label published || true
          if [ "${{ github.event.action }}" = "labeled" ]; then gh issue close "$NUMBER" --reason "not planned" || true; fi

  verify:
    if: >-
      github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'job-post') &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'verified-poster'
    runs-on: ubuntu-latest
    concurrency:
      group: job-post-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update the verified list
        run: node scripts/review-job.js ${{ github.event.action == 'labeled' && 'verify' || 'unverify' }} > comment.md
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POSTER: ${{ github.event.issue.user.login }}
      - name: Update jobs/*.json
        run: ./.github/scripts/apply-post.sh "Poster ${{ github.event.action == 'labeled' && 'verified' || 'unverified' }} (#$NUMBER)"
      - name: Comment
        run: gh issue comment "$NUMBER" --body-file comment.md

  report:
    if: github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'job-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Count the report
        id: report
        run: node scripts/review-job.js report
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update jobs/*.json
        if: steps.report.outputs.changes == 'true'
        run: ./.github/scripts/apply-post.sh "Report on job post #$POST (from #$NUMBER)"
        env:
          POST: ${{ steps.report.outputs.post }}
      - name: Write comments
        id: notes
        run: node scripts/review-job.js report-notes
      - name: Comment, label and close
        run: |
          if [ "${{ steps.notes.outputs.comment_post }}" = "true" ]; then gh issue comment "$POST" --body-file post-comment.md || true; fi
          if [ "$KIND" = "job" ] && [ "${{ steps.notes.outputs.hidden }}" = "true" ]; then
            # A board/company job was hidden for everyone: keep this report open for the admin.
            gh issue comment "$NUMBER" --body-file report-comment.md
            gh issue edit "$NUMBER" --add-label reported --add-label needs-review || true
            exit 0
          fi
          if [ "${{ steps.notes.outputs.hidden }}" = "true" ]; then
            gh issue edit "$POST" --add-label reported --add-label needs-review --remove-label published --remove-label approved || true
          fi
          gh issue close "$NUMBER" --reason completed --comment "$(cat report-comment.md)"
        env:
          POST: ${{ steps.report.outputs.post }}
          KIND: ${{ steps.report.outputs.kind }}

  unhide:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'job-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Un-hide the job
        id: unhide
        run: node scripts/review-job.js unhide > comment.md
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Update jobs/*.json
        if: steps.unhide.outputs.changes == 'true'
        run: ./.github/scripts/apply-post.sh "Un-hide reported job (#$NUMBER)"
      - name: Comment and close
        run: |
          gh issue edit "$NUMBER" --remove-label reported --remove-label needs-review || true
          gh issue close "$NUMBER" --reason completed --comment "$(cat comment.md)"

  expire:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Drop expired posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin dev && git reset -q --hard origin/dev
            node scripts/review-job.js expire > expired.txt
            if git diff --quiet; then break; fi
            git commit -qam "Expire job posts: $(cat expired.txt)" && git push -q origin HEAD:dev && break
            sleep $((i * 3))
          done
      - name: Close expired issues
        run: |
          for n in $(cat expired.txt); do
            gh issue close "$n" --reason completed --comment "This post reached its 30-day limit and was removed from knet. Post it again if the position is still open." || true
            gh issue edit "$n" --remove-label published || true
          done
